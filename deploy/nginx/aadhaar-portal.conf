# nginx site for the Aadhaar Collection Portal (alembicdigilabs.com).
#
# Install as /etc/nginx/conf.d/aadhaar-portal.conf (included inside the http block),
# then: nginx -t && systemctl reload nginx
#
# Same-site layout: the built React app is served from /, and /api/ is proxied to the
# Node.js API on 127.0.0.1:17101. The backend directory (and its private storage of
# Aadhaar files) is never under `root`, so nginx cannot serve it.

# Access log without query strings or request bodies: links and codes must never be
# written to logs. $uri is the path only.
log_format aadhaar_portal '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent $request_time "$http_user_agent"';

# Brute-force brake on sign-in endpoints (the API also limits per user).
limit_req_zone $binary_remote_addr zone=aadhaar_portal_auth:10m rate=20r/m;
# Employee page (booking link, emailed codes, uploads). The API also limits codes per
# employee and per address; this only brakes floods.
limit_req_zone $binary_remote_addr zone=aadhaar_portal_employee:10m rate=60r/m;

upstream aadhaar_portal_api {
    server 127.0.0.1:17101;
    keepalive 16;
}

# HTTP -> HTTPS (and the .in alias -> .com).
server {
    listen 80;
    listen [::]:80;
    server_name alembicdigilabs.com www.alembicdigilabs.com alembicdigilabs.in www.alembicdigilabs.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://alembicdigilabs.com$request_uri;
    }
}

# Aliases -> canonical host. Cookies and sessions live on alembicdigilabs.com only.
# Needs a certificate covering these names; delete this block to drop the aliases.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.alembicdigilabs.com alembicdigilabs.in www.alembicdigilabs.in;

    ssl_certificate     /etc/letsencrypt/live/alembicdigilabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alembicdigilabs.com/privkey.pem;

    return 301 https://alembicdigilabs.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name alembicdigilabs.com;

    ssl_certificate     /etc/letsencrypt/live/alembicdigilabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alembicdigilabs.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:aadhaar_portal_ssl:10m;
    ssl_session_tickets off;

    access_log /var/log/nginx/aadhaar-portal.access.log aadhaar_portal;
    error_log  /var/log/nginx/aadhaar-portal.error.log warn;

    # Security headers. Do not add `add_header` inside a location below: nginx would
    # then drop all of these for that location.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Built frontend (frontend/dist), copied here on deploy.
    root  /var/www/aadhaar-portal/frontend;
    index index.html;

    client_max_body_size 1m;

    # --- API ---------------------------------------------------------------

    location ^~ /api/auth/ {
        limit_req zone=aadhaar_portal_auth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://aadhaar_portal_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ^~ /api/e/ {
        limit_req zone=aadhaar_portal_employee burst=30 nodelay;
        limit_req_status 429;
        # One Aadhaar file per request, up to 10 MB (the API answers anything larger).
        client_max_body_size 11m;

        proxy_pass http://aadhaar_portal_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /api/ {
        # Room for large uploads and form data.
        client_max_body_size 25m;

        proxy_pass http://aadhaar_portal_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Stream large downloads (hotel ZIPs) instead of spooling them to disk.
        proxy_buffering off;
        proxy_max_temp_file_size 0;
    }

    # --- Frontend ----------------------------------------------------------

    # Fingerprinted build assets: cache for a year.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html, which is never cached.
    location / {
        expires -1;
        try_files $uri /index.html;
    }

    # Never serve dotfiles (.env, .git) even if one ends up under root by mistake.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
